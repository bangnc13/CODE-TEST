<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;font:14px/1.3 "Source Sans Pro",system-ui,sans-serif}
button{width:100%;height:42px;border-radius:12px;border:1.5px solid #0f766e;background:#fff;color:#0f766e;font:600 14px inherit;cursor:pointer}
button:hover{background:#0f766e;color:#fff}button:disabled{opacity:.6;cursor:wait}
#s{margin:5px 2px 0;font-size:12px;color:#5b6f6a}
</style></head><body><button id="b">📍 Lấy vị trí hiện tại của tôi</button><div id="s"></div>
<script>
const post=(t,d)=>parent.postMessage({isStreamlitMessage:true,type:t,...d},'*');
post('streamlit:componentReady',{apiVersion:1});post('streamlit:setFrameHeight',{height:70});
const b=document.getElementById('b'),s=document.getElementById('s');
b.onclick=()=>{
 if(!navigator.geolocation){s.textContent='Thiết bị không hỗ trợ định vị.';return}
 b.disabled=true;s.textContent='Đang lấy vị trí…';
 navigator.geolocation.getCurrentPosition(p=>{
  b.disabled=false;s.textContent='Đã lấy vị trí (±'+Math.round(p.coords.accuracy)+' m)';
  post('streamlit:setComponentValue',{value:{lat:p.coords.latitude,lon:p.coords.longitude},dataType:'json'});
 },()=>{b.disabled=false;s.textContent='Chưa có quyền định vị. Hãy cho phép vị trí cho trang này.'},
 {enableHighAccuracy:true,timeout:15000,maximumAge:30000});
};
</script></body></html>
